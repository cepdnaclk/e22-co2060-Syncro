name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. Backend CI: FastAPI Tests & Validation
  # ==========================================
  backend-ci:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  # ==========================================
  # 2. Frontend CI: React / Vite Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (React / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

  # ==========================================
  # 3. Continuous Deployment (CD) Status Notification
  # ==========================================
  deploy-status:
    name: Continuous Deployment (Render & Vercel)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Log Deployment Notification
        run: |
          echo "=========================================================="
          echo "CI checks passed successfully on main!"
          echo "Render and Vercel will now deploy the verified build."
          echo "Backend: https://e22-co2060-syncro.onrender.com"
          echo "=========================================================="
