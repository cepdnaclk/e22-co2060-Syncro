
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: syncro_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncro123}
      POSTGRES_DB: ${POSTGRES_DB:-syncro_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: syncro_backend
    env_file:
      - ./code/backend/.env
    volumes:
      - ./code/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-syncro123}@db:5432/${POSTGRES_DB:-syncro_db}
      SECRET_KEY: ${SECRET_KEY:-syncro_dev_secret_key_change_in_production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      EMAIL_MODE: ${EMAIL_MODE:-smtp}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React / Vite Frontend
  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
    container_name: syncro_frontend
    volumes:
      - ./code/frontend:/app
      - /app/node_modules
    command: npx vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
